name: OpenAPI sync

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake spec:fetch
      - run: bundle exec rake spec:report > /tmp/openapi-report.md
      - run: bundle exec rake codegen
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(spec): sync Notion OpenAPI"
          title: "chore(spec): sync Notion OpenAPI"
          branch: chore/spec-sync
          body-path: /tmp/openapi-report.md
